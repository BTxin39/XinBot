[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xinbot"
version = "0.1.0"
description = "Local AI companion with Live2D, character cards and memory management"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pillow>=11.0.0",
    "chromadb>=0.5.0",
    "beautifulsoup4>=4.12",
    "fastapi>=0.136.3",
    "markdown>=3.6",
    "mcp>=1.0.0",
    "openai>=2.36.0",
    "pydantic-settings>=2.14.1",
    "pypdf>=5.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.50",
    "typer>=0.25.1",
    "pygame>=2.6",
    "uvicorn[standard]>=0.35",
    "python-multipart>=0.0.20",
    "aiofiles>=25.1",
]
[project.scripts]
xinbot = "app.cli.app:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["app.web.node_modules*", "app.web.static*", "app.web.tests*"]

[tool.setuptools.package-data]
"app.core" = ["defaults.json"]
"app.web" = ["static/dist/*.html", "static/dist/assets/*"]

[tool.uv]
package = true

[project.optional-dependencies]
image = ["pillow>=11.0.0"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
